[project]
name = "compas-worker"
version = "0.1.0"
description = "Compás ML worker (Dramatiq) — Phase 4+"
requires-python = ">=3.11"
dependencies = [
    "dramatiq[redis]>=1.17",
    "redis>=5.2",
    "pydantic>=2.9",
    "httpx>=0.27",
    "compas-ml",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compas_worker"]

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0a0a" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Compás" />
		<title>Compás</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #0a0a0a;
				--fg: #f0f0f0;
				--muted: #888;
				--accent: #4f9eff;
				--requinto: #2dd4bf;
				--segunda: #38bdf8;
				--bass: #fb923c;
				--bongo: #a3e635;
				--guira: #facc15;
				--clave: #a78bfa;
				--palmas: #94a3b8;
				--vocals: #ec4899;
			}
			* { box-sizing: border-box; }
			html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif; }
			/* prevent rubber-banding on iOS */
			html, body { overscroll-behavior: none; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// Register service worker
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/service-worker.js').catch((err) => {
						console.warn('SW registration failed:', err);
					});
				});
			}
			// Haptic feedback helper (iOS Safari supports navigator.vibrate; otherwise no-op)
			window.compasHaptic = (pattern) => {
				try {
					if (navigator.vibrate) navigator.vibrate(pattern);
				} catch (e) { /* noop */ }
			};
		</script>
	</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Web build ----
  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@12.6.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @compas/web run build

      - name: Type check
        run: pnpm --filter @compas/shared-types run lint

  # ---- Python lint + import smoke test ----
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install API deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install ruff pydantic pydantic-settings fastapi uvicorn 'sqlalchemy>=2.0' aiosqlite python-multipart httpx

      - name: Ruff
        working-directory: apps/api
        run: ruff check .

  # ---- Golden set validation ----
  golden-validate:
    name: Golden set validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate golden set
        run: |
          python golden/scripts/validate.py golden/songs/
          python golden/scripts/stats.py

  # ---- Golden set pipeline regression (slow; nightly + manual) ----
  # Run with: gh workflow run ci.yml -f run_regression=true
  # Or on a nightly cron: see .github/workflows/nightly-regression.yml
  golden-regression:
    name: Golden set pipeline regression
    runs-on: ubuntu-latest
    needs: [web-build, python-lint, golden-validate]
    if: github.event.inputs.run_regression == 'true' || github.event.schedule
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML deps (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.1.0+cpu" "torchaudio==2.1.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install demucs librosa soundfile "numpy<2" "scipy<1.14" openai-whisper stable-ts
          pip install -e packages/ml

      - name: Generate synthetic pilots
        run: python golden/scripts/generate_synthetic.py

      - name: Run pipeline regression
        run: |
          python -c "
          import sys, json
          sys.path.insert(0, 'packages/ml')
          from pathlib import Path
          from compas_ml.pipeline import run_pipeline
          from compas_ml.config import PipelineConfig
          from golden.scripts.validate import validate_one
          
          config = PipelineConfig(transcribe=False)
          results = []
          for song_dir in Path('golden/songs').iterdir():
              if song_dir.suffix != '.json':
                  continue
              ann = json.loads(song_dir.read_text())
              song_id = ann['song_id']
              wav = song_dir.with_suffix('.wav')
              if not wav.exists():
                  print(f'SKIP {song_id}: no audio')
                  continue
              try:
                  result = run_pipeline(str(wav), Path(f'/tmp/compas-test/{song_id}'), genre=ann['metadata']['genre'], config=config)
                  # Compute simple accuracy
                  pred_bpm = result['global']['bpm']
                  true_bpm = ann['global']['bpm']
                  bpm_err = abs(pred_bpm - true_bpm) / true_bpm
                  results.append({'song': song_id, 'bpm_pred': pred_bpm, 'bpm_true': true_bpm, 'bpm_err': bpm_err})
                  print(f'{song_id}: BPM pred={pred_bpm:.1f} true={true_bpm:.1f} err={bpm_err*100:.1f}%')
              except Exception as e:
                  print(f'FAIL {song_id}: {e}')
          # Summary
          if results:
              mean_err = sum(r['bpm_err'] for r in results) / len(results)
              print(f'\\nMean BPM error: {mean_err*100:.1f}%')
              # Gate: must be < 20% (loose for synthetic music)
              if mean_err > 0.20:
                  print('::error::BPM regression detected')
                  sys.exit(1)
          "
